<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda EB | Grupo Garrett</title>
<link rel="icon" type="image/png" id="favicon" href="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0D6174;--brand-dark:#0A4E5D;--brand-soft:#E4F0F2;--brand-2:#3FA3A8;
  --aura:#1C5FA8;--aura-2:#5FD6C0;
  --ink:#1B2A33;--muted:#66737C;--line:#E2E7EA;--line-strong:#C9D1D6;--sunk:#F6F8F9;
  --ok:#2E7D4F;--ok-soft:#E3F2E8;--pend:#A86C12;--pend-soft:#FBF1DC;--danger:#B3242D;--danger-soft:#FBE7E8;
  --font:"Instrument Sans","Segoe UI",system-ui,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.muted{color:var(--muted)}.small{font-size:13px}
.top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{height:30px;width:auto;display:block}
.top .app-name{padding-left:16px;border-left:1px solid var(--line);color:var(--muted);font-size:14px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:700}
main{max-width:1180px;margin:0 auto;padding:28px 24px 72px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 18px}h2{font-size:17px;margin:0 0 12px}
.btn{appearance:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:#fff;white-space:nowrap}
.btn:hover{background:var(--sunk)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-dark)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer}.lnk:hover{text-decoration:underline}.lnk.red{color:var(--danger)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.chip{appearance:none;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px}.kpi span{font-size:13px;color:var(--muted)}
.kpi strong{display:block;font-size:24px;font-weight:600;margin-top:2px}.kpi.main strong{color:var(--brand)}.kpi.bad strong{color:var(--danger)}
.box{border:1px solid var(--line);border-radius:12px;padding:18px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}td p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.r{text-align:right}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.pend{background:var(--pend-soft);color:var(--pend)}.pill.bad{background:var(--danger-soft);color:var(--danger)}.pill.info{background:var(--brand-soft);color:var(--brand)}.pill.off{background:var(--sunk);color:var(--muted)}
.info{border-radius:8px;background:var(--brand-soft);padding:10px 12px;font-size:14px;margin-bottom:16px}
.info ul{margin:6px 0 0;padding-left:20px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 12px}.err:empty{display:none}
.empty{color:var(--muted);font-size:14px;padding:18px 0;margin:0}
.f{display:grid;gap:5px;margin-bottom:14px}.f>span{font-size:13px;font-weight:600}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scrim{position:fixed;inset:0;background:rgba(27,42,51,.25);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.open{transform:none;box-shadow:-16px 0 40px rgba(20,40,50,.15)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}.drawer header h2{margin:0;overflow-wrap:anywhere}
.drawer .body{padding:18px 20px;overflow-y:auto;flex:1}.drawer footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fadeUp .35s ease both}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ===== Agenda EB ===== */
.bar-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.bar-row h1{margin:0;flex:1}
.sync{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:#fff;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.nav{display:flex;align-items:center;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.nav .lbl{font-weight:600;font-size:18px;margin-right:auto}
.ic{appearance:none;border:1px solid var(--line-strong);background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
.ic:hover{background:var(--sunk)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip .dot,.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.mh,.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mh div{font-size:12px;font-weight:600;color:var(--muted);padding:0 6px 6px}
.mg{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:hover{background:var(--sunk)}
.day.out{background:#FAFBFC}.day.out .n{color:#A9B3B9}
.day .n{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .n{background:var(--brand);color:#fff}
.day.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.ev{font-size:12px;line-height:1.3;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 12%,#fff);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev:hover{background:color-mix(in srgb,var(--c) 22%,#fff)}
.done{opacity:.55;text-decoration:line-through}
.ev.late,.wev.late{background:var(--danger-soft)}
.more{font-size:11px;color:var(--muted);font-weight:600;padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{border:1px solid var(--line);border-radius:10px;min-height:220px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer}
.wcol.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.wcol h3{font-size:12px;margin:0 0 2px;color:var(--muted);font-weight:600}.wcol h3 b{color:var(--ink);font-size:16px;margin-left:4px}
.wev{font-size:13px;padding:6px 8px;border-radius:7px;background:color-mix(in srgb,var(--c) 10%,#fff);border-left:3px solid var(--c);cursor:pointer;min-width:0}
.wev small{display:block;color:var(--muted);font-size:12px}.wev strong{display:block;font-weight:600;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{appearance:none;background:#fff;border:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:4px 104px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px 10px 0;text-align:left;cursor:pointer;width:100%}
.it:last-child{border-bottom:0}.it:hover{background:var(--sunk)}
.it .b{align-self:stretch;background:var(--c);border-radius:0 3px 3px 0}
.it .tm{font-size:13px;font-weight:600}.it .tm small{display:block;color:var(--muted);font-weight:400}
.it .mn strong{display:block;overflow-wrap:anywhere;font-weight:600}.it .mn small{color:var(--muted);font-size:13px}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.sec h2{margin:0}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:16px;border-top:4px solid var(--c);display:flex;flex-direction:column;gap:12px}
.tcard h3{margin:0;font-size:16px}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.st4 div{background:var(--sunk);border-radius:8px;padding:6px 2px}.st4 b{display:block;font-size:18px}.st4 span{font-size:11px;color:var(--muted)}
.st4 .bad b{color:var(--danger)}
.mini{display:flex;flex-direction:column;gap:2px}
.mini button{appearance:none;border:0;background:none;text-align:left;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px;display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px}
.mini button:hover{background:var(--sunk)}.mini button span{color:var(--muted)}.mini button.late span{color:var(--danger);font-weight:600}
.mini h4{margin:4px 0 2px;font-size:12px;color:var(--muted);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:12px}.chk input{width:auto;margin:0}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14px;margin:0 0 16px}.dl dt{color:var(--muted)}.dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.hist{font-size:13px;border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:8px}.hist p{margin:0}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(27,42,51,.35);z-index:60;padding:16px}.modal.open{display:grid}
.modal .card{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:22px}.modal .card h2{margin-bottom:8px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.gate{max-width:480px;margin:60px auto;text-align:center}.gate p{color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters>*{width:auto;min-width:160px;flex:1}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
.colors{display:flex;gap:8px;flex-wrap:wrap}.colors button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong);background:var(--c);cursor:pointer}.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.rems{display:flex;gap:6px;flex-wrap:wrap}
.custom{display:grid;grid-template-columns:80px 1fr auto;gap:8px;margin-top:8px}
.tipos{display:flex;gap:6px;flex-wrap:wrap}
.tipos .chip[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.hide{display:none!important}
@media (max-width:860px){.top{padding:12px 16px}.top .app-name{display:none}main{padding:20px 14px 60px}.two{grid-template-columns:1fr}}
@media (max-width:720px){.day{min-height:58px;padding:4px}.day .ev,.day .more{display:none}.dots{display:flex}
  .week{grid-template-columns:1fr}.wcol{min-height:0}.it{grid-template-columns:4px 78px minmax(0,1fr)}.it .pill{grid-column:3;justify-self:start}
  .dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:8px}.filters>*{min-width:0;flex-basis:100%}.top .right .nm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* =====================================================================
   AGENDA EB — calendario de los ejecutivos de Beneficios
   Datos en SharePoint (sitio Beneficios) por Microsoft Graph.
   Cada actividad puede ir al Outlook del ejecutivo (con Teams si es reunión)
   y deja programados correos de recordatorio (envío diferido de Outlook).
   ===================================================================== */
const CONFIG = {
  clientId: 'f0e84e7f-82f3-4f42-9ebb-4e95e1fca868',   // misma app de Entra que los otros sistemas
  tenantId: '6d19a314-7bcf-411f-b9fd-8f6bc92c1e7b',
  siteHost: 'aurainnovacionessa.sharepoint.com',
  sitePath: '/sites/Beneficios',
  lists: { act: 'EB Actividades', usr: 'EB Usuarios', his: 'EB Historial' },
  privadas: ['act', 'his'],                            // listas donde cada quien solo ve y edita lo suyo
  tz: 'Central America Standard Time',
  refreshMinutes: 5,
  propGuid: '{8c3f2a71-5b1e-4d2a-9f0c-3e7b6a1d4c25}',  // marca interna de los correos de recordatorio
};
const SCOPES = ['User.Read', 'Sites.ReadWrite.All', 'Calendars.ReadWrite', 'Mail.Send', 'Mail.ReadWrite'];
const SCOPES_ADMIN = [...SCOPES, 'Sites.Manage.All'];
const PROP = `String ${CONFIG.propGuid} Name EBActividad`;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s), view = () => $('#view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lc = s => String(s || '').trim().toLowerCase();
const jparse = v => { try { const a = JSON.parse(v || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
const pad = n => String(n).padStart(2, '0');
const K = d => { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fromK = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (k, n) => { const d = fromK(k); d.setDate(d.getDate() + n); return K(d); };
const sod = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return +d; };
const DAY = 864e5;
const fmtD = ms => { const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtDs = ms => { const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const fmtT = ms => new Date(ms).toLocaleTimeString('es-CR', { hour: 'numeric', minute: '2-digit', hour12: true });
const hhmm = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const localStr = ms => `${K(ms)}T${hhmm(ms)}:00`;
const DOW = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const DOWL = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'setiembre', 'octubre', 'noviembre', 'diciembre'];
const monday = k => { const d = fromK(k); return addD(k, -((d.getDay() + 6) % 7)); };
const dayLabel = k => { const d = fromK(k); const s = `${DOWL[d.getDay()]} ${fmtD(d)}`; return s[0].toUpperCase() + s.slice(1); };
const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const isEmail = s => /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(s);

const TIPOS = [['Reunión', '#1C5FA8'], ['Trabajo', '#0D6174'], ['Proyecto', '#7A4FB5'], ['Pendiente', '#A86C12'], ['Otro', '#66737C']];
const tipoColor = t => (TIPOS.find(x => x[0] === t) || TIPOS[4])[1];
const PALETA = ['#0D6174', '#1C5FA8', '#B4532A', '#7A4FB5', '#2E7D4F', '#C2416B', '#A86C12', '#3FA3A8', '#5B6B2E', '#334E68'];
const PRESETS = [15, 60, 1440, 4320, 10080, 20160];
const remLabel = m => m % 10080 === 0 ? `${m / 10080} semana${m / 10080 > 1 ? 's' : ''}` : m % 1440 === 0 ? `${m / 1440} día${m / 1440 > 1 ? 's' : ''}` : m % 60 === 0 ? `${m / 60} h` : `${m} min`;

/* ---------- estado ---------- */
const S = { acts: [], users: [] };
const V = { role: null, admin: false, tab: null, mode: 'mes', cursor: K(Date.now()), sel: K(Date.now()), filt: new Set(),
  q: '', fEstado: 'activas', fTipo: '', fEjec: '', busy: false, syncedAt: 0, issues: [], f: null };
const G = { pca: null, account: null, me: null, site: null, lp: {}, cols: {}, created: [] };
const myMail = () => lc(G.me?.mail || G.me?.userPrincipalName);

/* ---------- Microsoft 365 ---------- */
class GraphError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function loadMsal() {
  if (window.msal) return;
  await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js'; s.onload = ok; s.onerror = () => ko(new Error('No se pudo cargar el inicio de sesión de Microsoft. Revisa tu conexión a internet.')); document.head.appendChild(s); });
}
async function token(scopes = SCOPES) {
  try { return (await G.pca.acquireTokenSilent({ scopes, account: G.account })).accessToken; }
  catch (e) { if (scopes !== SCOPES) throw e; await G.pca.acquireTokenRedirect({ scopes, account: G.account }); throw new Error('redirect'); }
}
async function call(method, path, body, scopes, extra) {
  const url = path.startsWith('http') ? path : 'https://graph.microsoft.com/v1.0' + path;
  let r;
  try { r = await fetch(url, { method, headers: { Authorization: 'Bearer ' + await token(scopes), 'Content-Type': 'application/json', Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly', ...(extra || {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { if (e.message === 'redirect') throw e; throw new GraphError(0, 'No hay conexión con Microsoft. Revisa tu internet e intenta de nuevo.'); }
  if (r.status === 202 || r.status === 204) return null;
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new GraphError(r.status, j?.error?.message || r.statusText);
  return j;
}
const gx = (m, p, b, extra) => call(m, p, b, SCOPES, extra);
const gxAdmin = (m, p, b) => call(m, p, b, SCOPES_ADMIN);
async function allItems(key) {
  if (!G.lp[key]) return [];
  let url = `${G.lp[key]}/items?$expand=fields&$top=999`, out = [];
  while (url) { const j = await gx('GET', url); out = out.concat(j.value); url = j['@odata.nextLink'] || null; }
  return out;
}
function errMsg(e) {
  const s = e?.status;
  if (s === 401 || s === 403) return 'no tienes permiso para esto. Pídele a Ian que revise tus permisos.';
  if (s === 404) return 'no se encontró lo que se buscaba (puede que alguien lo haya borrado).';

}

/* ---------- Recordatorios por correo (envío diferido de Outlook) ----------
   Se crea un correo para uno mismo con la hora de envío diferida (PidTagDeferredSendTime).
   Exchange lo guarda y lo manda a esa hora aunque nadie tenga la página abierta.
   Si la actividad cambia, se borran los que aún no salieron y se vuelven a programar. */
const Rem = {
  anchor: a => a.allDay ? sod(a.ini) + 8 * 3600e3 : a.ini,      // las de todo el día se cuentan desde las 8:00 a. m.
  async cancel(id) {
    const f = encodeURIComponent(`singleValueExtendedProperties/Any(ep: ep/id eq '${PROP}' and ep/value eq '${id}')`);
    for (const folder of ['outbox', 'drafts']) {
      let r; try { r = await gx('GET', `/me/mailFolders/${folder}/messages?$filter=${f}&$select=id&$top=50`); } catch (e) { if (e.status === 404) continue; throw e; }
      for (const m of r.value || []) { try { await gx('DELETE', `/me/messages/${m.id}`); } catch (e) { if (e.status !== 404) throw e; } }
    }
  },
  async schedule(a, m, at) {
    const msg = await gx('POST', '/me/messages', {
      subject: `Recordatorio: ${a.title} · ${a.allDay ? fmtD(a.ini) : fmtD(a.ini) + ' ' + fmtT(a.ini)}`,
      body: { contentType: 'HTML', content: mailHtml(a, m) }, importance: a.prio === 'Alta' ? 'high' : 'normal',
      toRecipients: [{ emailAddress: { address: myMail() } }],
      singleValueExtendedProperties: [{ id: 'SystemTime 0x3FEF', value: new Date(at).toISOString() }, { id: PROP, value: String(a.id) }] });
    await gx('POST', `/me/messages/${msg.id}/send`);
  },
  async reschedule(a, isNew) {
    if (!isNew) await this.cancel(a.id);
    if (!isOpen(a)) return 0;
    let n = 0;
    for (const m of [...new Set(a.rems)].sort((x, y) => y - x)) { const at = this.anchor(a) - m * 60e3; if (at <= Date.now() + 60e3) continue; await this.schedule(a, m, at); n++; }
    return n;
  },
};
function mailHtml(a, m) {
  const url = location.origin + location.pathname;
  const row = (k, v) => v ? `<tr><td style="padding:4px 14px 4px 0;color:#66737C;vertical-align:top">${k}</td><td style="padding:4px 0">${v}</td></tr>` : '';
  return `<div style="font-family:'Segoe UI',Arial,sans-serif;color:#1B2A33;max-width:560px">
<div style="border-left:4px solid ${tipoColor(a.tipo)};padding:4px 14px;margin:0 0 18px"><div style="font-size:12px;color:#66737C">Agenda EB · Recordatorio</div><div style="font-size:20px;font-weight:600">${esc(a.title)}</div></div>
<table style="font-size:14px;border-collapse:collapse">${row('Cuándo', esc(whenText(a)))}${row('Tipo', esc(a.tipo))}${row('Cliente / lugar', esc(a.lugar))}${row('Prioridad', a.prio === 'Normal' ? '' : esc(a.prio))}</table>
${a.desc ? `<p style="font-size:14px;white-space:pre-wrap;background:#F6F8F9;border-radius:8px;padding:10px 12px">${esc(a.desc)}</p>` : ''}
<p style="margin:20px 0">${a.tlink ? `<a href="${esc(a.tlink)}" style="background:#4B53BC;color:#fff;padding:9px 16px;border-radius:8px;text-decoration:none;font-weight:600;margin-right:8px">Unirse por Teams</a>` : ''}<a href="${esc(url)}" style="background:#0D6174;color:#fff;padding:9px 16px;border-radius:8px;text-decoration:none;font-weight:600">Abrir mi agenda</a></p>
<p style="font-size:12px;color:#66737C">Te llega porque pusiste un recordatorio de ${remLabel(m)} antes.</p></div>`;

async function hist(a, accion, detalle) {

  await gx('POST', `${G.lp.his}/items`, { fields: noNulls(pick('his', { Title: a.title, Accion: accion, ActividadId: a.id, Detalle: detalle || '', Correo: myMail(), Nombre: G.me.displayName || '' })) });

async function persist(a, accion, detalle) {
  const isNew = !a.id, warn = [];
  if (isNew) { const r = await gx('POST', `${G.lp.act}/items`, { fields: noNulls(A_OUT(a)) }); a.id = +r.id; a.created = Date.parse(r.createdDateTime); }
  try { await Outlook.sync(a); } catch (e) { if (e.message === 'redirect') throw e; console.warn('Outlook', e); warn.push('no se pudo actualizar tu Outlook (' + errMsg(e) + ')'); }
  let n = 0;
  try { n = await Rem.reschedule(a, isNew); } catch (e) { if (e.message === 'redirect') throw e; console.warn('Recordatorios', e); warn.push('no se pudieron programar los correos de recordatorio (' + errMsg(e) + ')'); }
  await gx('PATCH', `${G.lp.act}/items/${a.id}/fields`, A_OUT(a));
  a.modified = Date.now();
  hist(a, accion, detalle).catch(e => console.warn('Historial', e));
  const i = S.acts.findIndex(x => x.id === a.id); if (i >= 0) S.acts[i] = a; else S.acts.push(a);
  return { warn, n };
}
function diffText(o, a) {
  const c = [];
  if (o.title !== a.title) c.push(`título («${o.title}» → «${a.title}»)`);
  if (o.ini !== a.ini || o.fin !== a.fin || o.allDay !== a.allDay) c.push(`fecha (${whenText(o)} → ${whenText(a)})`);
  if (o.tipo !== a.tipo) c.push(`tipo (${o.tipo} → ${a.tipo})`);
  if (o.estado !== a.estado) c.push(`estado (${o.estado} → ${a.estado})`);
  if (o.prio !== a.prio) c.push(`prioridad (${o.prio} → ${a.prio})`);
  if (o.lugar !== a.lugar) c.push('cliente / lugar');
  if (o.desc !== a.desc) c.push('descripción');
  if (JSON.stringify(o.rems) !== JSON.stringify(a.rems)) c.push('recordatorios');
  if (o.teams !== a.teams || o.invitados !== a.invitados) c.push('reunión de Teams / invitados');
  if (o.outlook !== a.outlook) c.push(a.outlook ? 'se agregó a Outlook' : 'se quitó de Outlook');
  return c.length ? 'Cambió: ' + c.join('; ') : 'Sin cambios';
}

    <span class="seg"><button data-act="mode" data-m="mes" aria-pressed="${V.mode === 'mes'}">Mes</button><button data-act="mode" data-m="semana" aria-pressed="${V.mode === 'semana'}">Semana</button></span></div>`;

const itemsOn = (acts, k) => { const f = +fromK(k); return acts.filter(a => overlaps(a, f, f + DAY)).sort((x, y) => (y.allDay - x.allDay) || byIni(x, y)); };
function monthHTML(acts) {
  const c = fromK(V.cursor), first = K(new Date(c.getFullYear(), c.getMonth(), 1)), last = K(new Date(c.getFullYear(), c.getMonth() + 1, 0));
  let k = monday(first); const end = addD(monday(last), 6), today = K(Date.now());
  let h = `<div class="mh">${DOW.map(d => `<div>${d}</div>`).join('')}</div><div class="mg">`;
  for (; k <= end; k = addD(k, 1)) {
    const its = itemsOn(acts, k), out = k.slice(0, 7) !== first.slice(0, 7);
    h += `<div class="day ${out ? 'out' : ''} ${k === today ? 'today' : ''} ${k === V.sel ? 'sel' : ''}" data-act="day" data-day="${k}"><span class="n">${fromK(k).getDate()}</span>
      ${its.slice(0, 3).map(a => `<div class="ev ${a.estado === 'Hecho' ? 'done' : ''} ${isLate(a) ? 'late' : ''}" data-act="detail" data-id="${a.id}" style="--c:${colorOf(a)}" title="${esc(a.title)}">${a.allDay ? '' : `<b>${hhmm(a.ini)}</b> `}${esc(a.title)}</div>`).join('')}
      ${its.length > 3 ? `<span class="more">+${its.length - 3} más</span>` : ''}<span class="dots">${its.slice(0, 5).map(a => `<i style="--c:${colorOf(a)}"></i>`).join('')}</span></div>`;
  }
  return h + '</div>';
}
function weekHTML(acts) {
  const m = monday(V.cursor), today = K(Date.now()), jefe = V.role === 'jefe';
  let h = '<div class="week">';
  for (let i = 0; i < 7; i++) {
    const k = addD(m, i), its = itemsOn(acts, k);
    h += `<div class="wcol ${k === today ? 'today' : ''}" ${jefe ? '' : `data-act="new" data-day="${k}"`}><h3>${DOW[i]}<b>${fromK(k).getDate()}</b></h3>
      ${its.map(a => `<div class="wev ${isLate(a) ? 'late' : ''}" data-act="detail" data-id="${a.id}" style="--c:${colorOf(a)}"><small>${a.allDay ? 'Todo el día' : fmtT(a.ini)}${jefe ? ' · ' + esc(userBy(a.ejec)?.nombre || a.ejecNombre) : ''}</small><strong class="${a.estado === 'Hecho' ? 'done' : ''}">${esc(a.title)}</strong></div>`).join('')}</div>`;

}

async function loadHist(id) {

function drawRems() {
  const all = [...new Set([...PRESETS, ...V.f.rems])].sort((x, y) => x - y);
  $('#rems').innerHTML = all.map(m => `<button type="button" class="chip" data-act="rtog" data-m="${m}" aria-pressed="${V.f.rems.includes(m)}">${remLabel(m)}</button>`).join('');
}
function readForm() {
  const v = id => $(id).value, allDay = $('#a_ad').checked;
  const title = v('#a_t').trim(), d1 = v('#a_d1'), d2 = v('#a_d2') || d1;
  if (!title) return { err: 'Escribe qué es la actividad.' };
  if (!d1) return { err: 'Escoge la fecha.' };
  let ini, fin;
  if (allDay) { ini = +fromK(d1); fin = d2 > d1 ? +fromK(d2) : null; if (d2 < d1) return { err: 'La fecha final no puede ser antes de la inicial.' }; }
  else {
    const h1 = v('#a_h1'), h2 = v('#a_h2');
    if (!h1) return { err: 'Escoge la hora.' };
    const at = (d, h) => { const [H, M] = h.split(':').map(Number); const x = fromK(d); x.setHours(H, M, 0, 0); return +x; };
    ini = at(d1, h1); fin = h2 ? at(d2, h2) : ini + 3600e3;
    if (fin <= ini) return { err: 'La hora final tiene que ser después de la inicial.' };
  }
  const inv = parseInv(v('#a_i'));
  const bad = String(v('#a_i')).split(/[\s,;]+/).filter(s => s && !isEmail(s));
  if (bad.length) return { err: 'Revisa estos correos de invitados: ' + bad.join(', ') };
  return { title, tipo: V.f.tipo, allDay, ini, fin, lugar: v('#a_l').trim(), desc: v('#a_ds').trim(), prio: v('#a_p'), estado: $('#a_e') ? v('#a_e') : null,
    rems: [...new Set(V.f.rems)].sort((x, y) => y - x), outlook: $('#a_o').checked, teams: $('#a_tm').checked, invitados: inv.join(', ') };
}
async function saveAct(btn) {
  const r = readForm(); if (r.err) { $('#ferr').textContent = r.err; $('#drawer .body').scrollTop = 0; return; }
  const old = V.f.id ? S.acts.find(x => x.id === V.f.id) : null;
  const a = old ? { ...old, ...r, estado: r.estado || old.estado } : { ...r, id: null, estado: 'Pendiente', oid: '', olink: '', tlink: '', ejec: myMail(), ejecNombre: G.me.displayName || '', completado: null };
  if (old && a.estado === 'Hecho' && old.estado !== 'Hecho') a.completado = Date.now();
  if (old && a.estado !== 'Hecho') a.completado = null;
  btn.disabled = true; btn.textContent = 'Guardando…'; V.busy = true;
  try {
    const { warn, n } = await persist(a, old ? 'Editada' : 'Creada', old ? diffText(old, a) : whenText(a));
    closeDrawer(); V.sel = K(a.ini); if (V.mode === 'mes' && K(a.ini).slice(0, 7) !== V.cursor.slice(0, 7)) V.cursor = K(a.ini); render();
    toast(warn.length ? 'Se guardó, pero ' + warn.join(' y ') + '.' : `Guardada${a.oid ? ' y en tu Outlook' : ''}${n ? ` · ${n} recordatorio${n > 1 ? 's' : ''} programado${n > 1 ? 's' : ''}` : ''}.`, warn.length ? 8000 : 3500);
  } catch (e) { if (e.message === 'redirect') return; btn.disabled = false; btn.textContent = 'Guardar'; $('#ferr').textContent = 'No se pudo guardar: ' + errMsg(e); }
  finally { V.busy = false; }
}
async function quick(q, id, btn) {
  const old = S.acts.find(x => x.id === id); if (!old) return;
  const a = { ...old }; let accion = '';
  if (q === 'done') { a.estado = 'Hecho'; a.completado = Date.now(); accion = 'Marcada como hecha'; }
  if (q === 'reopen') { a.estado = 'Pendiente'; a.completado = null; accion = 'Reabierta'; }
  if (q === 'restore') { a.estado = 'Pendiente'; accion = 'Restaurada'; }
  if (q === 'retire') {
    if (!await ask('¿Retirar esta actividad?', 'Se quita de tu Outlook y se cancelan sus recordatorios. Queda guardada como «Retirada» y la puedes restaurar.', 'Retirar', true)) return;
    a.estado = 'Retirado'; accion = 'Retirada';
  }
  if (btn) { btn.disabled = true; } V.busy = true;
  try { const { warn } = await persist(a, accion, ''); closeDrawer(); render(); toast(warn.length ? 'Listo, pero ' + warn.join(' y ') + '.' : accion + '.', warn.length ? 8000 : 3000); }
  catch (e) { if (e.message !== 'redirect') { if (btn) btn.disabled = false; toast('No se pudo: ' + errMsg(e), 6000); } }
  finally { V.busy = false; }
}

/* ---------- eventos ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = +el.dataset.id;
  if (act === 'fallday') { document.querySelectorAll('[data-timed]').forEach(x => x.classList.toggle('hide', el.checked)); return; }
  if (act === 'fteams') { if (el.checked) $('#invWrap').classList.remove('hide'); return; }
  e.preventDefault();
  switch (act) {
    case 'tab': V.tab = el.dataset.k; render(); scrollTo(0, 0); break;
    case 'logout': G.pca.logoutRedirect({ account: G.account, postLogoutRedirectUri: location.origin + location.pathname }); break;
    case 'refresh': try { await reload(); render(); toast('Actualizado.'); } catch (x) { toast('No se pudo actualizar: ' + errMsg(x)); } break;
    case 'mode': V.mode = el.dataset.m; render(); break;
    case 'nav': { const d = +el.dataset.d;
      if (!d) { V.cursor = V.sel = K(Date.now()); }
      else if (V.mode === 'mes') { const c = fromK(V.cursor); V.cursor = K(new Date(c.getFullYear(), c.getMonth() + d, 1)); }
      else V.cursor = addD(V.cursor, 7 * d);
      render(); break; }
    case 'day': V.sel = el.dataset.day; render(); break;
    case 'filt': { const m = el.dataset.e; if (!m) V.filt.clear(); else V.filt.has(m) ? V.filt.delete(m) : V.filt.add(m); render(); break; }
    case 'verEjec': V.filt = new Set([el.dataset.e]); V.tab = 'agenda'; closeDrawer(); render(); scrollTo(0, 0); break;
    case 'verVencidas': V.tab = 'lista'; V.fEstado = 'vencidas'; render(); break;
    case 'detail': e.stopPropagation(); detail(id); break;
    case 'new': if (V.role === 'ejec') actForm(null, el.dataset.day); break;
    case 'edit': actForm(S.acts.find(x => x.id === id)); break;
    case 'close': closeDrawer(); break;
    case 'ftipo': V.f.tipo = el.dataset.t; document.querySelectorAll('[data-act="ftipo"]').forEach(b => b.setAttribute('aria-pressed', b === el)); if (V.f.tipo === 'Reunión') $('#invWrap').classList.remove('hide'); break;
    case 'rtog': { const m = +el.dataset.m; V.f.rems = V.f.rems.includes(m) ? V.f.rems.filter(x => x !== m) : [...V.f.rems, m]; drawRems(); break; }
    case 'raddc': { const n = +$('#a_rn').value, m = n * +$('#a_ru').value; if (!(n > 0)) { $('#ferr').textContent = 'Escribe cuánto tiempo antes.'; break; } if (!V.f.rems.includes(m)) V.f.rems.push(m); $('#a_rn').value = ''; $('#ferr').textContent = ''; drawRems(); break; }
    case 'saveAct': saveAct(el); break;
    case 'quick': quick(el.dataset.q, id, el); break;
    case 'newUser': userForm(null); break;
    case 'editUser': userForm(S.users.find(u => u.id === id)); break;
    case 'ucolor': V.f.color = el.dataset.c; document.querySelectorAll('[data-act="ucolor"]').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'saveUser': saveUser(el); break;
  }
});
document.addEventListener('input', e => { const k = e.target.dataset?.in; if (!k) return; V[k] = e.target.value; const pos = e.target.selectionStart; render(); const n = document.querySelector(`[data-in="${k}"]`); if (n) { n.focus(); if (n.setSelectionRange && pos != null && n.type === 'search') n.setSelectionRange(pos, pos); } });
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawerOpen() && !$('#modal').classList.contains('open')) closeDrawer(); });

/* ---------- inicio ---------- */
function gate(title, text, btn) { view().innerHTML = `<div class="gate"><h1>${esc(title)}</h1><p>${text}</p>${btn || ''}</div>`; }
function detectRole() {
  const u = S.users.find(x => x.activo && x.correo === myMail());
  V.role = u ? (u.rol === 'Jefatura' ? 'jefe' : 'ejec') : null;
}
async function start() {
  if (location.protocol === 'file:') return gate('Abre la página desde internet', 'Esta página no funciona como archivo en la computadora. Ábrela desde su dirección web.');
  renderHeader();
  try {
    await loadMsal();
    G.pca = new msal.PublicClientApplication({ auth: { clientId: CONFIG.clientId, authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri: location.origin + location.pathname }, cache: { cacheLocation: 'localStorage' } });
    await G.pca.initialize();
    const res = await G.pca.handleRedirectPromise();
    G.account = res?.account || G.pca.getAllAccounts()[0] || null;
    if (!G.account) { gate('Agenda EB', 'Entra con tu cuenta de Microsoft de la empresa.', '<button class="btn primary" data-act="login">Iniciar sesión</button>');
      document.querySelector('[data-act="login"]').onclick = () => G.pca.loginRedirect({ scopes: SCOPES, prompt: 'select_account' }); return; }
    view().innerHTML = '<p class="muted">Conectando con SharePoint…</p>';
    const [me, site] = await Promise.all([gx('GET', '/me?$select=displayName,mail,userPrincipalName'),
      gx('GET', `/sites/${CONFIG.siteHost}:${CONFIG.sitePath}?$select=id`).catch(e => { throw new GraphError(e.status || 404, 'No puedo abrir el sitio Beneficios de SharePoint. Revisa que tengas acceso a ese sitio.'); })]);
    G.me = me; G.site = site.id; renderHeader();
    V.admin = await isSiteManager();
    await setup();
    if (!G.lp.act || !G.lp.usr) return gate('La agenda aún no está lista', 'Falta que un administrador del sitio Beneficios abra la página por primera vez para crear las listas.' + (V.issues.length ? '<br><br>' + V.issues.map(esc).join('<br>') : ''));
    try { await reload(); }
    catch (e) { if (e.status === 403 || e.status === 401) return gate('No tienes acceso', 'Tu usuario no tiene permiso en las listas de la Agenda EB. Pídele a Ian que te lo dé.'); throw e; }
    detectRole();
    if (!V.role && !V.admin) return gate('No tienes acceso', `Entraste como ${esc(myMail())}. Esta agenda es para el equipo de Beneficios; pídele a Ian que te agregue.`, '<button class="btn" data-act="logout">Entrar con otra cuenta</button>');
    if (G.created.length) toast('Se crearon las listas: ' + G.created.join(', ') + '. Revisa los permisos en la pestaña Usuarios.', 8000);
    render();
    setInterval(async () => {
      if (V.busy || drawerOpen() || $('#modal').classList.contains('open') || document.activeElement?.closest?.('input,textarea,select')) return;
      try { await reload(); detectRole(); render(); } catch (e) { console.warn(e); }
    }, CONFIG.refreshMinutes * 60e3);
  } catch (e) { console.error(e); if (e.message !== 'redirect') gate('No se pudo conectar', esc(errMsg(e)), '<button class="btn" onclick="location.reload()">Reintentar</button>'); }
}
start();
</script>
